<!DOCTYPE html>
<html lang="zh-CN">
<head><meta property="og:title" content="三国放置卡牌"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国放置 · 群雄逐鹿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314100b'/%3E%3Crect x='6' y='6' width='52' height='52' rx='9' fill='none' stroke='%23c9a24b' stroke-width='3'/%3E%3Ctext x='32' y='44' font-size='34' font-family='serif' font-weight='900' fill='%23e8c87a' text-anchor='middle'%3E%E4%B8%89%3C/text%3E%3C/svg%3E">
<style>
/* ============ 基础与色板 ============ */
:root{
  --ink:#14100b; --ink2:#1c1710; --panel:#241e15; --panel2:#2c241a; --panel3:#352c20;
  --gold:#c9a24b; --gold2:#e8c87a; --gold3:#8a6d2f; --goldline:rgba(201,162,75,.45);
  --paper:#efe3c8; --text:#efe3c8; --dim:#c4b392; --faint:#8a7a5f;
  --red:#c0392b; --red2:#e05a3c;
  --wei:#4a7fd4; --shu:#d4402f; --wu:#2f9e6e; --qun:#8f5fc7;
  --r:#5b8def; --sr:#9b6df0; --ssr:#f0a63a; --ur:#e8453a;
  --eq0:#cfcfcf; --eq1:#6fbf4a; --eq2:#4a90d9; --eq3:#9b6df0; --eq4:#f0a63a; --eq5:#ff4a5f;
  --danger:#e05a3c; --ok:#58b368; --info:#4a90d9;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#0d0a07;
  color:var(--text);
  font-family:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px; line-height:1.5;
  overflow:hidden;
}
h1,h2,h3,.serif{font-family:'Noto Serif SC','Songti SC',STSong,'SimSun',serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--gold3);border-radius:4px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
#app{height:100%;display:flex;flex-direction:column;position:relative}
#app::before{ /* 全局墨底纹理 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(201,162,75,.05), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(192,57,43,.04), transparent 50%),
    repeating-linear-gradient(115deg, transparent 0 26px, rgba(255,255,255,.008) 26px 27px);
}
#app>*{position:relative;z-index:1}

/* ============ 通用组件 ============ */
.panel{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--goldline);
  border-radius:10px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
  position:relative;
}
.panel::before{ /* 顶部金线 */
  content:"";position:absolute;top:0;left:12px;right:12px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);opacity:.7;
}
.panel-title{
  font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;color:var(--gold2);
  letter-spacing:2px;padding:12px 16px 10px;display:flex;align-items:center;gap:8px;
}
.panel-title::before{content:"";width:4px;height:16px;background:linear-gradient(180deg,var(--gold2),var(--gold3));border-radius:2px}
.sec-title{margin:14px 2px 8px;font-family:'Noto Serif SC',serif;font-size:15px;color:var(--gold);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--goldline),transparent)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 18px;border-radius:8px;font-size:14px;font-weight:500;letter-spacing:1px;
  transition:transform .08s,filter .15s,box-shadow .15s;user-select:none;
}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(180deg,#e9cd85,#c9a24b 55%,#9a7a35);color:#221a08;font-weight:700;box-shadow:0 3px 10px rgba(201,162,75,.28), inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:hover{filter:brightness(1.08)}
.btn-red{background:linear-gradient(180deg,#d95a41,#a93226);color:#fff6ea;font-weight:700;box-shadow:0 3px 10px rgba(192,57,43,.3), inset 0 1px 0 rgba(255,255,255,.25)}
.btn-red:hover{filter:brightness(1.08)}
.btn-ghost{background:rgba(201,162,75,.08);border:1px solid var(--goldline);color:var(--dim)}
.btn-ghost:hover{border-color:var(--gold2);color:var(--gold2);background:rgba(201,162,75,.12)}
.btn-dark{background:var(--panel3);border:1px solid rgba(255,255,255,.08);color:var(--dim)}
.btn-dark:hover{color:var(--text)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.5px;border:1px solid currentColor}
.chip-out{background:rgba(212,64,47,.12);color:var(--shu)}
.chip-tank{background:rgba(201,162,75,.12);color:var(--gold2)}
.chip-supp{background:rgba(74,127,212,.12);color:var(--wei)}
.chip-heal{background:rgba(88,179,104,.12);color:var(--ok)}
.chip-ass{background:rgba(143,95,199,.12);color:var(--qun)}
.sf-chip{padding:3px 12px;border-radius:16px;font-size:12px;border:1px solid rgba(255,255,255,.15);color:var(--dim);cursor:pointer;background:rgba(0,0,0,.2)}
.sf-chip.on{background:linear-gradient(135deg,#c8a24a,#8c6a1f);color:#1a1206;border-color:transparent;font-weight:600}
.mop-eq{padding:4px 8px;border-radius:14px;font-size:11px;border:1px solid rgba(255,255,255,.14);color:var(--dim);cursor:pointer;background:rgba(0,0,0,.2)}
.mop-eq.has{border-color:rgba(201,162,75,.5);color:#d9bc74}
.mop-eq.up{border-color:#e8c87a;color:#ffd98a;background:rgba(201,162,75,.14);font-weight:600}

/* 阵营色 */
.f-wei{color:var(--wei)} .f-shu{color:var(--shu)} .f-wu{color:var(--wu)} .f-qun{color:var(--qun)}
.bg-wei{background:var(--wei)} .bg-shu{background:var(--shu)} .bg-wu{background:var(--wu)} .bg-qun{background:var(--qun)}
.fac-wei{--fac:var(--wei)} .fac-shu{--fac:var(--shu)} .fac-wu{--fac:var(--wu)} .fac-qun{--fac:var(--qun)}
.r-r{--rarc:var(--r)} .r-sr{--rarc:var(--sr)} .r-ssr{--rarc:var(--ssr)} .r-ur{--rarc:var(--ur)}

/* ============ 顶栏 ============ */
#topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:8px 16px;background:linear-gradient(180deg,var(--ink2),rgba(20,16,11,.92));
  border-bottom:1px solid var(--goldline);
}
.brand{display:flex;align-items:center;gap:8px;font-family:'Noto Serif SC',serif;font-weight:900;font-size:18px;letter-spacing:3px;
  background:linear-gradient(180deg,#f6e3ac,var(--gold2) 45%,#9a7a35);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand .seal{width:26px;height:26px;flex:none}
.res-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.res-item{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:20px;font-size:12px;color:var(--dim);white-space:nowrap}
.res-item b{color:var(--paper);font-weight:600}
.res-item svg{flex:none}
.res-gold b{color:#ffd98a}
.res-power b{color:#ff8a5c}
.tb-actions{display:flex;align-items:center;gap:8px;flex:none}
.tb-btn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);color:var(--faint);transition:.15s;flex:none}
.tb-btn:hover{color:var(--gold2);border-color:var(--goldline)}
.tb-btn.on{color:var(--gold2);border-color:var(--goldline);background:rgba(201,162,75,.14)}
.tb-btn.off{opacity:.55}
.tb-btn.off svg{stroke:var(--red2)}

/* ============ 底部导航 ============ */
#nav{
  display:flex;justify-content:space-around;align-items:stretch;
  padding:4px 6px calc(6px + env(safe-area-inset-bottom,0));
  background:linear-gradient(180deg,rgba(28,23,16,.96),#14100b);
  border-top:1px solid var(--goldline);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;color:var(--faint);font-size:11px;letter-spacing:1px;border-radius:8px;transition:.15s}
.nav-item svg{width:22px;height:22px}
.nav-item:hover{color:var(--dim)}
.nav-item.active{color:var(--gold2)}
.nav-item.active svg{filter:drop-shadow(0 0 6px rgba(201,162,75,.55))}
.nav-item .n-badge{min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;margin-top:-1px}

/* ============ 主视图 ============ */
#view{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.view-wrap{max-width:1120px;margin:0 auto;padding:14px 16px 26px}

/* ============ 主页 ============ */
#home-hero{
  position:relative;border-radius:14px;overflow:hidden;min-height:300px;
  border:1px solid var(--goldline);box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:flex;flex-direction:column;justify-content:flex-end;
}
#home-hero .bgimg{position:absolute;inset:0;width:100%;height:100%}
.bg-main{background-image:url('assets/bg-main.jpg');background-size:cover;background-position:center 28%}
.bg-battle{background-image:url('assets/bg-battle.jpg');background-size:cover;background-position:center 45%}
#home-hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,4,.28) 0%,rgba(10,7,4,.05) 45%,rgba(10,7,4,.9) 100%)}
.home-hero-body{position:relative;padding:22px 22px 18px;z-index:1}
.home-title{font-family:'Noto Serif SC',serif;font-weight:900;font-size:34px;letter-spacing:8px;line-height:1.2;
  background:linear-gradient(180deg,#fbecc2,var(--gold2) 40%,#b1893a 75%,#8a6d2f);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 18px rgba(0,0,0,.6);margin-bottom:6px}
.home-sub{color:var(--dim);font-size:13px;letter-spacing:3px;margin-bottom:14px}
.home-hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.home-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.hq{padding:14px 16px;display:flex;align-items:center;gap:12px}
.hq .hq-ic{width:44px;height:44px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-weight:900;font-size:20px;color:#201807;background:linear-gradient(180deg,#e9cd85,#b3893c)}
.hq .hq-tx{flex:1;min-width:0}
.hq .hq-tx b{font-size:14px;color:var(--paper);display:block}
.hq .hq-tx span{font-size:11.5px;color:var(--faint);display:block;margin-top:2px}
.hq .hq-btn{flex:none}

/* ============ 章节与关卡 ============ */
.chap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chap-name{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:900;color:var(--gold2);letter-spacing:2px;display:flex;align-items:center;gap:10px}
.chap-name small{font-family:'Noto Sans SC',sans-serif;font-size:12px;color:var(--faint);font-weight:400;letter-spacing:0}
.chap-tabs{display:flex;gap:6px;flex-wrap:wrap}
.chap-tab{padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);color:var(--dim);font-size:12px;background:rgba(0,0,0,.3)}
.chap-tab.cur{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,75,.12)}
.stage-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.stage-node{
  position:relative;padding:10px 6px 8px;border-radius:10px;text-align:center;
  border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,var(--panel3),var(--panel2));
  transition:.15s;color:var(--dim);
}
.stage-node .sn-name{font-size:13px;font-weight:700;color:var(--paper);letter-spacing:1px}
.stage-node .sn-st{font-size:11px;color:var(--faint);margin-top:2px}
.stage-node.cleared{border-color:rgba(88,179,104,.5)}
.stage-node.cleared .sn-st{color:var(--ok)}
.stage-node.cur{border-color:var(--gold2);box-shadow:0 0 14px rgba(201,162,75,.35);animation:curPulse 2s infinite}
.stage-node.cur .sn-name{color:#ffd98a}
.stage-node.boss::after{content:"帅";position:absolute;top:-7px;right:-5px;width:18px;height:18px;border-radius:50%;background:linear-gradient(180deg,#d95a41,#a93226);color:#ffe9d6;font-size:10px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-weight:900;box-shadow:0 0 8px rgba(217,90,65,.6)}
.stage-node.lock{opacity:.5}
@keyframes curPulse{0%,100%{box-shadow:0 0 8px rgba(201,162,75,.3)}50%{box-shadow:0 0 18px rgba(201,162,75,.55)}}

/* ============ 武将卡 ============ */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.hero-card{
  position:relative;border-radius:10px;padding:8px 6px 8px;text-align:center;cursor:pointer;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid rgba(255,255,255,.09);
  border-top:2px solid var(--fac,var(--gold3));
  transition:transform .12s,box-shadow .12s;overflow:hidden;
}
.hero-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.hero-card .h-water{position:absolute;right:-6px;bottom:-14px;font-family:'Noto Serif SC',serif;font-size:64px;font-weight:900;opacity:.06;color:var(--fac,#fff);line-height:1;pointer-events:none}
.hero-card .h-rarity{position:absolute;top:5px;left:6px;width:9px;height:9px;border-radius:50%;background:var(--rarc,#5b8def);box-shadow:0 0 6px var(--rarc,#5b8def)}
.hero-card .h-fac{position:absolute;top:4px;right:6px;font-size:11px;font-weight:700;color:var(--fac,#fff);opacity:.9;letter-spacing:0}
.h-med{position:relative;width:62px;height:62px;margin:2px auto 5px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-weight:900;font-size:30px;color:#fdf3da;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.22), rgba(0,0,0,.28) 70%), linear-gradient(160deg, color-mix(in srgb,var(--fac,#c9a24b) 78%, #000), color-mix(in srgb,var(--fac,#c9a24b) 30%, #000));
  border:2px solid var(--rarc,#5b8def);box-shadow:0 0 0 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.5), inset 0 0 10px rgba(0,0,0,.3)}
.h-med::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px dashed rgba(255,255,255,.25)}
.h-name{font-size:13px;font-weight:700;color:var(--paper);letter-spacing:1px}
.h-meta{font-size:10.5px;color:var(--faint);margin-top:2px;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.h-stars{color:var(--gold2);font-size:9px;letter-spacing:1px;margin-top:2px}
.h-power{font-size:10.5px;color:#ff9a6a;margin-top:2px}
.h-flag{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--fac,#c9a24b);opacity:.85}

/* 2.5D 武将立绘（上场形象，无边框） */
.portrait{background-size:300% 200%;background-repeat:no-repeat;border-radius:10px;background-color:#0d0a06;box-shadow:0 5px 14px rgba(0,0,0,.5)}
.portrait.s0{background-image:url('assets/heroes-starter.jpg')}
.portrait.s1{background-image:url('assets/heroes-1.jpg')}
.portrait.s2{background-image:url('assets/heroes-2.jpg')}
.portrait.s3{background-image:url('assets/heroes-3.jpg')}
.portrait.s4{background-image:url('assets/heroes-4.jpg')}
.portrait.s5{background-image:url('assets/heroes-5.jpg')}
.portrait.s6{background-image:url('assets/heroes-6.jpg')}
.portrait.s7{background-image:url('assets/heroes-7.jpg')}
.portrait.p0{background-position:0% 0%}
.portrait.p1{background-position:50% 0%}
.portrait.p2{background-position:100% 0%}
.portrait.p3{background-position:0% 100%}
.portrait.p4{background-position:50% 100%}
.portrait.p5{background-position:100% 100%}
.bu-portrait{width:64px;height:96px;margin:0 auto;border-radius:8px}
.form-portrait{width:88px;height:132px;border-radius:12px;margin:2px auto 4px}
.m-portrait{width:72px;height:108px;border-radius:10px;flex:none}
.r-portrait{width:64px;height:96px;border-radius:8px;margin:2px auto 4px}
.portrait.gs{filter:grayscale(1) brightness(.72);opacity:.9}
.c-portrait{width:100%;aspect-ratio:2/3;height:auto;margin:0 auto 5px;border-radius:12px}
.art-big{width:min(66vw,430px);aspect-ratio:2/3;height:auto;margin:0 auto;border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.65)}

/* 阵容槽 */
.form-slot{position:relative;border-radius:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  border:1.5px dashed rgba(201,162,75,.35);background:rgba(0,0,0,.22);transition:.15s}
.form-slot:hover{border-color:var(--gold2);background:rgba(201,162,75,.05)}
.form-slot .fs-empty{color:var(--faint);font-size:12px;letter-spacing:1px}
.form-slot.has{border-style:solid;border-color:rgba(255,255,255,.1);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bond-list{display:flex;flex-direction:column;gap:8px}
.bond-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25)}
.bond-item.on{border-color:var(--goldline);background:linear-gradient(90deg,rgba(201,162,75,.14),rgba(201,162,75,.04))}
.bond-item .b-stat{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:'Noto Serif SC',serif}
.bond-item.on .b-stat{background:linear-gradient(180deg,#e9cd85,#b3893c);color:#221a08}
.bond-item.off .b-stat{background:rgba(255,255,255,.06);color:var(--faint)}
.bond-item .b-name{font-weight:700;color:var(--paper);font-size:13px}
.bond-item .b-desc{font-size:11.5px;color:var(--faint);margin-top:1px}
.bond-item .b-heroes{font-size:10.5px;color:var(--dim);margin-top:1px;letter-spacing:.5px}
.bond-item.on .b-desc{color:#c9b57f}

/* ============ 招募 ============ */
.recruit-stage{position:relative;border-radius:14px;overflow:hidden;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid var(--goldline);margin-bottom:14px}
.recruit-stage .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.recruit-stage .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,4,.4),rgba(10,7,4,.75))}
.recruit-stage>*{position:relative;z-index:1}
.recruit-stage h2{font-family:'Noto Serif SC',serif;font-size:26px;letter-spacing:6px;color:var(--gold2);text-shadow:0 2px 10px rgba(0,0,0,.7)}
.recruit-stage p{color:var(--dim);font-size:12.5px;letter-spacing:1px}
.recruit-odds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.odd-box{text-align:center;padding:10px 6px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.3)}
.odd-box .o-r{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.odd-box b{display:block;font-size:16px;font-family:'Noto Serif SC',serif;color:var(--paper);margin-top:2px}
.odd-box span{font-size:11px;color:var(--faint)}
.recruit-pity{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pity-item{font-size:12px;color:var(--dim)}
.pity-item b{color:var(--gold2);font-family:'Noto Serif SC',serif;font-size:15px;margin:0 3px}

/* 招募结果 */
.result-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 0}
.result-card{width:96px;text-align:center;perspective:600px;animation:rcIn .5s both}
.result-card .rc-inner{position:relative;width:100%;height:132px;transform-style:preserve-3d;transition:transform .6s}
.result-card.flip .rc-inner{transform:rotateY(180deg)}
.result-card .rc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--rarc,#5b8def);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.result-card .rc-back{transform:none;background:repeating-linear-gradient(45deg, rgba(201,162,75,.08) 0 8px, rgba(0,0,0,.2) 8px 16px)}
.result-card .rc-hero{transform:rotateY(180deg)}
.result-card.flip .rc-hero{animation:rcFlash .6s ease-out}
@keyframes rcFlash{0%{filter:brightness(1.7)}100%{filter:brightness(1)}}
.result-card.best.flip::after{content:"";position:absolute;inset:-6px;border-radius:12px;background:radial-gradient(circle,rgba(255,214,120,.38),transparent 70%);animation:rcBurst .8s ease-out both;pointer-events:none}
@keyframes rcBurst{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.result-card .rc-face .h-med{width:52px;height:52px;font-size:26px}
.result-card .rc-name{font-size:13px;font-weight:700;color:var(--paper)}
.craft-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(0,0,0,.22);margin-bottom:7px}
.craft-dot{width:13px;height:13px;border-radius:4px;flex:none;box-shadow:0 0 6px rgba(255,255,255,.15)}
.craft-name{flex:1;font-size:13px;font-weight:700}
.craft-n{font-size:11.5px;color:var(--faint);flex:none}
.craft-btn{flex:none}
.eq-ico{display:inline-block;background:url(assets/equips.jpg) no-repeat;background-size:300% 200%;flex:none}
.eq-ico-lg{width:54px;height:54px}
.ico-weapon{background-position:0% 0%}
.ico-armor{background-position:50% 0%}
.ico-helm{background-position:100% 0%}
.ico-boots{background-position:0% 100%}
.ico-mount{background-position:50% 100%}
.eq-slot .es-icobox,.eq-item-card .ei-icobox{height:58px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.07);margin-bottom:6px;overflow:hidden}
.eq-slot .es-icobox.has,.eq-item-card .ei-icobox{box-shadow:inset 0 0 12px color-mix(in srgb,var(--eqc,#cfcfcf) 28%,transparent),0 0 10px color-mix(in srgb,var(--eqc,#cfcfcf) 40%,transparent)}
.eq-ico-empty{width:30px;height:30px;border-radius:50%;border:1px dashed rgba(255,255,255,.22);opacity:.55}
.form-slot .fs-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:0 6px;font-size:8.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.form-slot .fs-stats .fs-pow{color:#ff9a6a;font-weight:700}
.rc-top{margin-top:6px;font-size:13px;color:var(--faint)}
.rc-top b{font-size:17px;font-family:'Noto Serif SC',serif;color:var(--gold2);letter-spacing:1px}
.rc-top .rc-top-r{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#221a08;border-radius:4px;padding:1px 7px;vertical-align:2px}
.result-card.best .rc-face{border-color:var(--goldline);box-shadow:0 0 16px rgba(201,162,75,.35)}
.result-card.best .rc-name{color:var(--gold2)}
@keyframes rcIn{from{opacity:0;transform:translateY(16px) scale(.8)}to{opacity:1;transform:none}}

/* ============ 战斗 ============ */
#battle-view{position:relative;min-height:calc(100vh - 210px);border-radius:14px;overflow:hidden;border:1px solid var(--goldline);display:flex;flex-direction:column}
#battle-view .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#battle-view .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,3,.5),rgba(8,5,3,.35) 40%,rgba(8,5,3,.88))}
.battle-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.battle-enemy,.battle-player{position:relative;z-index:1;display:flex;justify-content:center;gap:6px;padding:6px 10px}
.battle-player{order:3;padding-bottom:14px}
.bunit{width:78px;flex:none;position:relative;text-align:center;transition:transform .15s}
.bunit .bu-med{width:56px;height:56px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-weight:900;font-size:26px;color:#fdf3da;border:2px solid transparent;position:relative;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.22),rgba(0,0,0,.3) 75%)}
.bunit .bu-hp{height:10px;border-radius:5px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.28);margin:5px 4px 0;overflow:hidden;position:relative}
.bunit .bu-hp i{display:block;height:100%;background:linear-gradient(90deg,#42b96a,#8fe09a);transition:width .25s}
.bunit .bu-hp .hp-tx{position:absolute;inset:0;font-size:8.5px;font-weight:700;line-height:10px;text-align:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95);z-index:2;pointer-events:none}
.bunit .bu-en{height:6px;border-radius:3px;background:rgba(0,0,0,.72);border:1px solid rgba(140,180,255,.3);margin:3px 4px 0;overflow:hidden;position:relative}
.bunit .bu-en i{display:block;height:100%;background:linear-gradient(90deg,#2f6fd8,#58b0ff);transition:width .25s}
.bunit .bu-en .en-tx{position:absolute;inset:0;font-size:7.5px;font-weight:700;line-height:6px;text-align:center;color:#cfe2ff;text-shadow:0 1px 2px rgba(0,0,0,.95);z-index:2;pointer-events:none;letter-spacing:1px}
.bunit .bu-en.ready{border-color:rgba(255,205,90,.75);box-shadow:0 0 8px rgba(255,190,60,.35)}
.bunit .bu-en.ready i{background:linear-gradient(90deg,#e0a83c,#ffd98a)}
.bunit .bu-en.ready .en-tx{color:#ffdf9a;animation:enPulse .5s ease-in-out infinite}
@keyframes enPulse{0%,100%{opacity:1}50%{opacity:.55}}
.bunit .bu-name{font-size:10.5px;color:var(--paper);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.bunit.att{transform:translateY(-6px)}
.bunit.hit .bu-med{animation:hitShake .35s}
.bunit.dead{opacity:.25;filter:grayscale(.9)}
.bunit .bu-lv{font-size:9px;color:var(--faint)}
@keyframes hitShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.dmg-float{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:'Noto Serif SC',serif;font-weight:900;font-size:15px;color:#ffd98a;text-shadow:0 1px 4px rgba(0,0,0,.9);animation:dmgUp 1s both;pointer-events:none;white-space:nowrap;z-index:5}
.dmg-float.crit{color:#ff5a4a;font-size:19px}
.dmg-float.heal{color:#7fe89a}
.dmg-float.dim{color:#c9b57f;font-size:11px}
@keyframes dmgUp{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}
/* ============ 技能特效 ============ */
.dmg-float.dmg{font-size:16px;color:#ffd98a}
.bunit.cast{animation:castLift .6s ease-out}
.bunit.cast::after{content:"";position:absolute;left:50%;top:30px;width:64px;height:64px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.8),rgba(255,180,80,.2) 55%,transparent 72%);animation:castBurst .65s ease-out both;pointer-events:none;z-index:4}
@keyframes castLift{0%{transform:translateY(0)}30%{transform:translateY(-9px)}100%{transform:translateY(0)}}
@keyframes castBurst{0%{opacity:0;transform:translate(-50%,0) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,0) scale(1.6)}}
.bunit.hit .bu-portrait{animation:hitShake .35s;filter:brightness(1.6)}
.bunit.healfx .bu-portrait{animation:healGlow .7s ease-out}
.bunit.healfx::before{content:"";position:absolute;left:50%;top:0;width:10px;height:10px;transform:translateX(-50%);border-radius:50%;background:#7fe89a;box-shadow:0 0 8px #7fe89a;animation:healRise .7s ease-out both;pointer-events:none;z-index:4}
@keyframes healGlow{0%{filter:brightness(1) drop-shadow(0 0 0 rgba(127,232,154,0))}30%{filter:brightness(1.4) drop-shadow(0 0 10px rgba(127,232,154,.95))}100%{filter:brightness(1) drop-shadow(0 0 0 rgba(127,232,154,0))}}
@keyframes healRise{0%{opacity:0;transform:translate(-50%,16px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px) scale(1.25)}}
.bunit.bufffx .bu-portrait{animation:buffRing .7s ease-out}
.bunit.bufffx::before{content:"";position:absolute;left:50%;top:30px;width:66px;height:66px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(120,170,255,.95);box-shadow:0 0 12px rgba(120,170,255,.85),inset 0 0 8px rgba(120,170,255,.5);animation:buffExpand .7s ease-out both;pointer-events:none;z-index:4}
@keyframes buffRing{0%{filter:brightness(1)}40%{filter:brightness(1.45)}100%{filter:brightness(1)}}
@keyframes buffExpand{0%{opacity:0;transform:translateX(-50%) scale(.4)}35%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.5)}}
.fx-aoe{position:absolute;z-index:2;left:0;right:0;height:30%;pointer-events:none}
.fx-aoe-e{top:0}
.fx-aoe-p{bottom:0}
.fx-aoe::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,220,120,.55),rgba(255,120,60,.18) 55%,transparent 78%);animation:aoePulse .7s ease-out both}
.fx-aoe::after{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px 5px rgba(255,200,90,.95);animation:aoeSweep .7s ease-out both}
@keyframes aoePulse{0%{opacity:0;transform:scale(.6)}25%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
@keyframes aoeSweep{0%{transform:translateY(-32px);opacity:0}15%{opacity:1}100%{transform:translateY(32px);opacity:0}}
.skill-banner{position:absolute;z-index:3;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
  font-family:'Noto Serif SC',serif;font-weight:900;font-size:26px;letter-spacing:4px;color:#ffd98a;text-shadow:0 0 18px rgba(255,217,138,.8),0 2px 6px rgba(0,0,0,.9);white-space:nowrap;animation:sbShow 1.2s both}
.skill-banner.enemy{color:#ff8a7a}
@keyframes sbShow{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
/* ============ 技能 cut-in 特写（画面中间人物本体，无边框） ============ */
.ult-cut{position:absolute;inset:0;z-index:5;opacity:0;pointer-events:none;overflow:hidden}
.ult-cut.show{opacity:1;animation:ucLife 1.4s ease-out both}
.ult-cut .uc-art{position:absolute;left:52%;top:58%;height:56%;width:auto;transform:translate(-50%,-50%);
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(255,120,50,.32));
  animation:ucPop .4s cubic-bezier(.16,.84,.32,1) both}
.ult-cut .uc-name{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-family:'Noto Serif SC',serif;font-weight:900;font-size:28px;letter-spacing:4px;
  color:#ffe0a3;text-shadow:0 0 22px rgba(255,140,50,.85),0 0 8px rgba(255,217,138,.6),0 3px 8px rgba(0,0,0,.95);white-space:nowrap;
  animation:ucName .42s .08s ease-out both}
.ult-cut .uc-hero{position:absolute;left:50%;top:calc(20% + 40px);transform:translateX(-50%);font-size:12px;letter-spacing:3px;color:#f4c96b;
  text-shadow:0 2px 6px rgba(0,0,0,.9);opacity:0;animation:ucName .42s .16s ease-out both}
.ult-cut .uc-flash{position:absolute;inset:0;background:radial-gradient(ellipse 42% 36% at 52% 54%,rgba(255,200,120,.38),rgba(255,120,50,.1) 55%,transparent 72%);
  animation:ucFlash .45s ease-out both}
@keyframes ucLife{0%{opacity:1}74%{opacity:1}100%{opacity:0}}
@keyframes ucFlash{0%{opacity:.9}100%{opacity:0}}
@keyframes ucPop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.26)}55%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes ucName{0%{opacity:0;transform:translateX(-50%) translateY(-12px)}60%{opacity:1}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
.battle-mid{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.battle-vs{font-family:'Noto Serif SC',serif;font-size:22px;letter-spacing:6px;color:rgba(232,200,122,.85);text-shadow:0 0 16px rgba(201,162,75,.6)}
.battle-round{font-size:12px;color:var(--dim);letter-spacing:2px}
.battle-ctl{position:relative;z-index:1;display:flex;justify-content:center;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.battle-log{position:relative;z-index:1;margin:0 12px 12px;max-height:130px;overflow-y:auto;font-size:11.5px;color:var(--dim);line-height:1.7;border-top:1px dashed rgba(201,162,75,.3);padding:6px 2px}
.battle-log b{color:var(--gold2);font-weight:600}
.battle-result{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,5,3,.82);backdrop-filter:blur(2px)}
.battle-result .br-title{font-family:'Noto Serif SC',serif;font-weight:900;font-size:40px;letter-spacing:10px}
.battle-result.win .br-title{color:#ffd98a;text-shadow:0 0 30px rgba(255,217,138,.7)}
.battle-result.lose .br-title{color:#ff7a6a;text-shadow:0 0 30px rgba(255,122,106,.5)}
.br-rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.br-reward{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);font-size:13px}
.br-reward b{color:#ffd98a}
.br-stats{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);min-width:240px}
.br-s-title{font-size:12px;color:var(--gold2);letter-spacing:3px;text-align:center;margin-bottom:2px}
.br-s-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.br-s-row b{color:#ffd98a}

/* ============ 详情弹窗 ============ */
#modal-root{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:14px}
#modal-root.open{display:flex}
#modal-root .m-veil{position:absolute;inset:0;background:rgba(6,4,2,.7);backdrop-filter:blur(2px)}
.modal{position:relative;width:min(640px,100%);max-height:86vh;overflow-y:auto;border-radius:14px;animation:modalIn .22s;background:linear-gradient(180deg,#2a231a,var(--panel));border:1px solid var(--goldline);box-shadow:0 20px 60px rgba(0,0,0,.6)}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.m-close{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:18px;z-index:5;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.m-close:hover{color:var(--gold2);border-color:var(--goldline)}
.m-head{display:flex;gap:16px;padding:20px 20px 14px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)}
.m-head .h-med{width:84px;height:84px;font-size:40px;flex:none}
.m-head .m-name{font-size:22px;font-weight:900;font-family:'Noto Serif SC',serif;letter-spacing:2px;color:var(--paper)}
.m-head .m-role{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.m-body{padding:14px 20px 20px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat-box{text-align:center;padding:8px 4px;border-radius:8px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07)}
.stat-box span{font-size:10.5px;color:var(--faint);display:block}
.stat-box b{font-size:15px;font-family:'Noto Serif SC',serif;color:var(--paper)}
.skill-box{margin-top:12px;padding:11px 13px;border-radius:8px;border:1px solid rgba(201,162,75,.3);background:rgba(201,162,75,.06)}
.skill-box .sk-name{font-weight:700;color:var(--gold2);font-family:'Noto Serif SC',serif;letter-spacing:1px}
.skill-box .sk-desc{font-size:12.5px;color:var(--dim);margin-top:3px}
.skill-box.sk-lock{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.03)}
.skill-box.sk-lock .sk-name{color:var(--faint)}
.skill-box.sk-ult{border-color:rgba(232,200,122,.55);background:linear-gradient(180deg,rgba(232,200,122,.13),rgba(201,162,75,.05));box-shadow:0 0 12px rgba(201,162,75,.14)}
.skill-box.sk-ult .sk-name{color:#ffd98a}
.skill-box.sk-ult .sk-desc{color:var(--paper)}
.sk-lock-tip{display:inline-block;margin-left:6px;font-size:11px;color:var(--faint);font-family:'Noto Sans SC',sans-serif;font-weight:400;letter-spacing:.5px}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.eq-slot{position:relative;padding:10px;border-radius:8px;border:1px dashed rgba(255,255,255,.15);background:rgba(0,0,0,.25);cursor:pointer;transition:.15s}
.eq-slot:hover{border-color:var(--goldline);background:rgba(201,162,75,.05)}
.eq-slot .es-name{font-size:10.5px;color:var(--faint)}
.eq-slot .es-item{font-size:12.5px;font-weight:700;color:var(--paper);margin-top:2px}
.eq-slot .es-item b{font-weight:700}
.eq-slot .es-lv{font-size:10px;color:var(--dim);margin-top:2px}
.act-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ============ 装备 ============ */
.eq-item-card{padding:8px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--eqc,#cfcfcf) 45%, transparent);background:rgba(0,0,0,.3);display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:.15s}
.eq-item-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.4)}
.eq-item-card .ei-n{font-size:12.5px;font-weight:700;color:var(--paper)}
.eq-item-card .ei-st{font-size:11px;color:var(--dim)}
.eq-item-card .ei-lv{font-size:10.5px;color:var(--faint)}

/* ============ 图鉴 ============ */
.codex-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{padding:4px 14px;border-radius:20px;font-size:12.5px;border:1px solid rgba(255,255,255,.12);color:var(--dim);background:rgba(0,0,0,.3);transition:.15s}
.fbtn.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,75,.14)}
.hero-card.owned{border-color:rgba(255,255,255,.16)}
.hero-card .h-not{opacity:.9;filter:grayscale(.4)}
.hero-card .h-not .h-med{background:#1d1a16;border-color:#4a443a;color:#6d6658}

/* ============ 设置 ============ */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 4px;border-bottom:1px dashed rgba(255,255,255,.09)}
.set-row:last-child{border-bottom:none}
.set-row .sr-tx b{display:block;color:var(--paper);font-size:14px}
.set-row .sr-tx span{font-size:11.5px;color:var(--faint)}
.switch{position:relative;width:46px;height:24px;border-radius:14px;background:rgba(255,255,255,.12);transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#c9b57f;transition:.2s}
.switch.on{background:linear-gradient(90deg,#b3893c,#e8c87a)}
.switch.on::after{left:25px;background:#fff8e6}

/* ============ 提示与通用 ============ */
#toast-root{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:9px 20px;border-radius:8px;background:rgba(20,16,11,.94);border:1px solid var(--goldline);color:var(--paper);font-size:13px;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .25s both;max-width:88vw}
.toast.err{border-color:rgba(224,90,60,.5);color:#ffb4a0}
.toast.ok{border-color:rgba(88,179,104,.5);color:#a9e6b5}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.empty-tip{text-align:center;color:var(--faint);padding:34px 10px;font-size:13px;letter-spacing:1px}
.power-tag{font-size:12px;color:#ff9a6a}

.guide-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.guide-step .gs-n{flex:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#e9cd85,#b3893c);color:#221a08;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif}
.guide-step p{font-size:12.5px;color:var(--dim);line-height:1.6}

.offline-box{position:relative;padding:16px;border-radius:12px;margin-top:14px;background:linear-gradient(180deg,rgba(232,200,122,.1),rgba(201,162,75,.04));border:1px solid var(--goldline);display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:curPulse 2.2s infinite}
.offline-box .ob-tx{flex:1;min-width:200px}
.offline-box .ob-tx b{font-family:'Noto Serif SC',serif;font-size:16px;color:var(--gold2);letter-spacing:1px}
.offline-box .ob-tx span{display:block;font-size:12px;color:var(--dim);margin-top:3px}

@media (max-width:560px){
  .home-title{font-size:27px;letter-spacing:5px}

  .form-grid{grid-template-columns:repeat(3,1fr)}

  .tb-btn{width:29px;height:29px}

  body.in-battle .chap-head,

  .battle-ctl .btn-sm{padding:3px 10px;font-size:11px}

function calcStats(defId,lv,star,eqMap,eqLv){
  const def=H[defId], b=BASE_STATS[def.rar], m=ROLE_M[def.role];

  for(const slot in eqMap){ const itid=eqMap[slot]; if(!itid) continue; const it=S.equipInv[itid]; if(!it) continue; const st=eqStatAt(it.slot,it.r,(eqLv&&eqLv[it.slot])||0); atkPct+=st.atkPct||0; defPct+=st.defPct||0; hpPct+=st.hpPct||0; spdFlat+=st.spdFlat||0; defFlat+=st.defFlat||0; hpFlat+=st.hpFlat||0; }

}

function applyBondStart(p,e){

      if(ts.length) ev.push({t:"skBuff",u:att,targets:ts,kind:"def",text:b.name+"：开局我军据守，防御提升！"});
    }else if(st.t==="bufAtk"){
      const ts=[]; p.filter(u=>u.alive).forEach(u=>{ u.buffs.atk=st.p; u.buffs.atkR=2; ts.push({side:u.side,idx:u.idx}); });
      if(ts.length) ev.push({t:"skBuff",u:att,targets:ts,kind:"atk",text:b.name+"：开局我军士气如虹，攻击提升！"});

function battleResolve(pUnits,eUnits){
  PLAYER_CACHE=pUnits; ENEMY_CACHE=eUnits;
  const ev=[]; let rounds=0;
  const all=()=>PLAYER_CACHE.filter(u=>u.alive).concat(ENEMY_CACHE.filter(u=>u.alive));
  while(rounds<40 && PLAYER_CACHE.some(u=>u.alive) && ENEMY_CACHE.some(u=>u.alive)){
    rounds++;
    all().forEach(u=>{ if(u.buffs.atkR>0){u.buffs.atkR--; if(u.buffs.atkR<=0)u.buffs.atk=0;} if(u.buffs.defR>0){u.buffs.defR--; if(u.buffs.defR<=0)u.buffs.def=0;} });
    const order=all().sort((a,b)=>b.spd-a.spd);
    for(const u of order){
      if(!u.alive) continue;
      if(u.stun>0){ u.stun--; ev.push({t:"stunText",u,text:u.name+"被眩晕，无法行动"}); continue; }
      u.energy+=35;
      if(u.energy>=100){
        u.energy=0;
        const def=H[u.defId];
        const has2=!!def.sk2 && u.star>=6;
        const seq=[];
        if(u.star>=7 && def.skU) seq.push(def.skU);
        if(has2) seq.push(def.sk2);
        seq.push(def.sk);
        let sk=seq[(u.skillIdx=(u.skillIdx||0))%seq.length]; u.skillIdx++;
        if(sk===def.skU) u.ultCast++;
        actSkill(u,ev,sk);
      } else actBasic(u,ev);
      if(!PLAYER_CACHE.some(x=>x.alive) || !ENEMY_CACHE.some(x=>x.alive)) break;
    }
  }
  const pAlive=PLAYER_CACHE.some(u=>u.alive), eAlive=ENEMY_CACHE.some(u=>u.alive);
  let win;
  if(eAlive && !pAlive) win=false;
  else if(pAlive && !eAlive) win=true;
  else{ // 打满回合：比较双方剩余生命占比
    const pr=PLAYER_CACHE.reduce((s,u)=>s+u.hp/u.maxHp,0), er=ENEMY_CACHE.reduce((s,u)=>s+u.hp/u.maxHp,0);
    win=pr>=er;
  }
  return {win,rounds,ev};
}
function calcBattleStats(ev,units){
  const m={}; units.forEach(u=>m[u.side+u.idx]={defId:u.defId,name:u.name,dmg:0,taken:0,heal:0});
  const key=u=>u.side+u.idx;
  ev.forEach(e=>{
    if(e.t==="atk"&&e.d!=null){ if(m[key(e.u)])m[key(e.u)].dmg+=e.d; if(e.target&&m[key(e.target)])m[key(e.target)].taken+=e.d; }
    else if(e.t==="skHit"&&e.targets){ const src=m[key(e.u)]; if(src) e.targets.forEach(t=>{ if(t.d!=null){ src.dmg+=t.d; const k=t.side+t.idx; if(m[k])m[k].taken+=t.d; } }); }
    else if(e.t==="skHeal"&&e.targets){ const src=m[key(e.u)]; if(src) e.targets.forEach(t=>{ if(t.h!=null) src.heal+=t.h; }); }
  });
  return m;
}
function statTop(m,key){ const arr=Object.values(m).filter(x=>x[key]>0).sort((a,b)=>b[key]-a[key]); return arr[0]||null; }

/* ============ 关卡奖励与挂机 ============ */
function stageRewards(c,s){
  const idx=(c-1)*10+s;
  const gold=Math.round(60+idx*40), exp=Math.round(40+idx*25);
  const ticketCh=Math.min(40,6+idx*.25);
  const eqCh=25;
  return {gold,exp,ticketCh,eqCh};
}
function rollEquip(c){
  const w=(c<=2)?[80,16,4,0,0,0]:(c<=4)?[55,30,13,2,0,0]:(c<=6)?[30,38,24,8,0,0]:(c<=8)?[14,30,34,18,4,0]:(c<=10)?[4,16,30,32,16,2]:[0,8,20,34,30,8];
  let r=0,roll=Math.random()*100; for(let i=0;i<6;i++){ if(roll<w[i]){r=i;break;} roll-=w[i]; }
  const slots=["weapon","armor","helm","boots","mount"];
  const slot=slots[Math.floor(Math.random()*5)];
  const id=uid(); S.equipInv[id]={id,slot,r,lv:0}; return id;
}
function applyStageRewards(c,s,isSweep){
  const rw=stageRewards(c,s);
  S.gold+=rw.gold; S.expBank+=rw.exp;
  const gained=[];
  if(Math.random()*100<rw.ticketCh){ S.tickets+=1; gained.push("招募令×1"); }
  if(Math.random()*100<rw.eqCh){ const id=rollEquip(c); gained.push(eqName(S.equipInv[id].slot,S.equipInv[id].r)+"×1"); }
  return {gold:rw.gold,exp:rw.exp,gained};
}
function advanceStage(){
  if(S.stage<10){ S.stage++; return; }
  if(S.chapter<CHAPTERS.length){ S.chapter++; S.stage=1; return; }
}
function idleRate(){ const idx=stageIdx(); return {gold:80+idx*50, exp:60+idx*32, ticket:0.4+idx*.03, eq:0.8+idx*.08}; }
function idleTick(){ const r=idleRate(); const mins=5/60; S.pending.gold+=r.gold*mins; S.pending.exp+=r.exp*mins; S.pending.tickets+=r.ticket*mins; S.pending.eqs+=r.eq*mins; }
function collectIdle(){
  const p=S.pending;
  const gold=Math.floor(p.gold), exp=Math.floor(p.exp), t=Math.floor(p.tickets), eq=Math.floor(p.eqs);
  if(gold+exp+t+eq===0){ toast("暂无挂机收益，先去闯关吧","err"); return; }
  S.gold+=gold; S.expBank+=exp; S.tickets+=t;
  const drops=[];
  for(let i=0;i<eq;i++){ const id=rollEquip(S.chapter); drops.push(eqName(S.equipInv[id].slot,S.equipInv[id].r)); }
  p.gold%=1;p.exp%=1;p.tickets%=1;p.eqs%=1;
  S.idleAt=Date.now();
  const msg="挂机收益：金币+"+fmt(gold)+" 经验+"+fmt(exp)+(t?" 招募令+"+t:"")+(drops.length? " 装备×"+drops.length:"");
  toast(msg,"ok");
  sfx("win");
  saveGame(); renderAll();
}
function calcOffline(){
  const ms=Date.now()-S.idleAt; if(ms<60000) return null;
  const mins=Math.min(720,ms/60000); const r=idleRate();
  const gold=Math.floor(r.gold*mins), exp=Math.floor(r.exp*mins), t=Math.floor(r.ticket*mins), eq=Math.floor(r.eq*mins);
  S.gold+=gold; S.expBank+=exp; S.tickets+=t;
  for(let i=0;i<eq;i++) rollEquip(S.chapter);
  S.idleAt=Date.now();
  return {gold,exp,t,eq,mins};
}

/* ============ 招募 ============ */
const PULL_ODDS=[{r:"r",p:58},{r:"sr",p:30},{r:"ssr",p:10.5},{r:"ur",p:1.5}];
function pullOnce(){
  S.pity.sr++; S.pity.ssr++;
  let forced=null;
  if(S.pity.ssr>=40){ forced="ssr"; S.pity.sr=0; S.pity.ssr=0; }
  else if(S.pity.sr>=10){ forced="sr"; S.pity.sr=0; }
  let pick;
  if(forced){ pick=forced; }
  else{ let roll=Math.random()*100; for(const o of PULL_ODDS){ if(roll<o.p){ pick=o.r; break; } roll-=o.p; } }
  const pool=HERO_IDS.filter(id=>H[id].rar===pick);
  const heroId=pool[Math.floor(Math.random()*pool.length)];
  heroData(heroId).c++; const isNew=heroData(heroId).c===1;
  S.stats.pulls++;
  S.stats.recruitsByRar[pick]++;
  if(pick==="sr"||pick==="ssr"||pick==="ur"){ S.pity.sr=0; }
  if(pick==="ssr"||pick==="ur"){ S.pity.ssr=0; }
  return {heroId,pick,new:isNew};
}
function recruit(n){
  if(S.tickets<n){ toast("招募令不足","err"); return null; }
  S.tickets-=n;
  const out=[]; for(let i=0;i<n;i++) out.push(pullOnce());
  return out;
}
function freePullAvailable(){ const d=new Date(); const k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); return S.freeDay!==k; }

/* ============ 养成 ============ */
function expNeed(lv){ return Math.round(50*Math.pow(lv,1.4)); }
function levelUpCost(lv){ return Math.round(expNeed(lv)*.2); }
function levelUp(id,n){ const h=heroData(id); let done=0;
  for(let i=0;i<n;i++){ if(h.lv>=100)break; const ne=expNeed(h.lv), gc=levelUpCost(h.lv); if(S.expBank<ne||S.gold<gc)break; S.expBank-=ne; S.gold-=gc; h.lv++; done++; }
  return done; }
function starUp(id){ const h=heroData(id); if(h.star>=9){ toast("已满星","err"); return false; }
  if(h.c<3){ toast("需要同名武将×3（含本体）","err"); return false; }
  const gold=500*Math.pow(h.star-4,2); if(S.gold<gold){ toast("金币不足","err"); return false; }
  S.gold-=gold; h.c-=2; h.star++;
  cleanupFormation(); saveGame(); return true; }
function upgradeEq(heroId,slot){ const h=heroData(heroId); const lv=(h.eqLv&&h.eqLv[slot])||0; if(lv>=eqMaxLv()){ toast("该部位已强化满级","err"); return false; }
  const itid=h.eq[slot]; const it=itid?S.equipInv[itid]:null;
  const cost=Math.round(Math.pow(lv+1,2)*25*EQ_RAR[Math.min(5,Math.max(0,(it&&it.r)||0))].m); if(S.gold<cost){ toast("金币不足","err"); return false; }
  S.gold-=cost; h.eqLv[slot]=lv+1; return true; }
function resetHero(id){
  const h=heroData(id);
  let expBack=0, goldBack=0;
  for(let lv=1; lv<h.lv; lv++){ expBack+=expNeed(lv); goldBack+=levelUpCost(lv); }
  h.lv=1;
  ["weapon","armor","helm","boots","mount"].forEach(slot=>{
    const L=(h.eqLv&&h.eqLv[slot])||0;
    if(L<=0) return;
    const itid=h.eq[slot]; const it=itid?S.equipInv[itid]:null;
    const q=Math.min(5,Math.max(0,(it&&it.r)||0));
    for(let k=0;k<L;k++){ goldBack+=Math.round(Math.pow(k+1,2)*25*EQ_RAR[q].m); }
    h.eqLv[slot]=0;
  });
  S.expBank+=expBack; S.gold+=goldBack;
  cleanupFormation(); saveGame();
  return {expBack,goldBack};
}
function equipItem(heroId,slot,itemId){ const it=S.equipInv[itemId]; if(!it)return false; if(it.slot!==slot){ toast("装备类型不符","err"); return false; }
  if(it.onHero && it.onHero!==heroId){ toast("该装备已被其他武将穿戴","err"); return false; }
  const h=heroData(heroId); if(h.eq[slot]){ S.equipInv[h.eq[slot]].onHero=null; } if(it.onHero){ heroData(it.onHero).eq[slot]=null; }
  h.eq[slot]=itemId; it.onHero=heroId; return true; }
function unequip(heroId,slot){ const h=heroData(heroId); const it=S.equipInv[h.eq[slot]]; if(!it)return; it.onHero=null; h.eq[slot]=null; }
function autoEquip(heroId){
  const h=heroData(heroId);
  let n=0;
  EQ_SLOTS.forEach(s=>{
    let best=null;
    for(const k in S.equipInv){
      const it=S.equipInv[k];
      if(!it||it.slot!==s.id||it.onHero) continue;
      if(!best||it.r>best.r||(it.r===best.r&&it.lv>best.lv)) best=it;
    }
    if(best&&h.eq[s.id]!==best.id){ if(equipItem(heroId,s.id,best.id)) n++; }
  });
  saveGame(); return n;
}
function unequipAll(heroId){
  const h=heroData(heroId);
  let n=0;
  EQ_SLOTS.forEach(s=>{ if(h.eq[s.id]){ unequip(heroId,s.id); n++; } });
  saveGame(); return n;
}

  // 开局羁绊效果重新施加一次，使动画中的血/怒气/增益与模拟结算完全一致
  const startEv2=applyBondStart(p,e);
  BATTLE.pUnits=p; BATTLE.eUnits=e; BATTLE.events=startEv2.concat(res.ev); BATTLE.evI=0; BATTLE.rounds=res.rounds; BATTLE.win=res.win; BATTLE.lastResult=null; BATTLE.stats=calcBattleStats(res.ev,p);

    const prev=stageIdx();
    advanceStage();
    BATTLE.lastResult={win:true,gold:r.gold,exp:r.exp,gained:r.gained};
    sfx("win");
  }else{
    S.stats.loses++; BATTLE.lastResult={win:false}; sfx("lose");
  }

  else{ renderBattleBox(); }
  if(!win){ setTimeout(()=>{ renderBattleBox(); },600); }
}
function startBattleAnim(){
  const ev=BATTLE.events, box=$("#battle-box");
  const step=()=>{
    if(BATTLE.phase!=="running") return;
    if(BATTLE.evI>=ev.length){ finishBattle(BATTLE.win,false); return; }
    const e=ev[BATTLE.evI++]; BATTLE.rounds=Math.max(BATTLE.rounds||0,1);
    applyEvent(e);
    const gap= ultCutImg(e)? (e.slot==="skU"?950:750) : 480;
    BATTLE.timer=setTimeout(step, gap/BATTLE.speed);

}

const ULT_SLOT_TAG={ sk:"主动技", sk2:"秘传", skU:"无双", bond:"羁绊技" };
function showUltCut(u, skName, img, slot){
  const layer=$("#ult-cut"); if(!layer) return;
  layer.innerHTML=`<div class="uc-flash"></div><img class="uc-art" src="${img}" alt=""><div class="uc-name">${esc(skName)}</div><div class="uc-hero">${slot==="bond"?esc("羁绊技"):esc(u.name+" · "+(ULT_SLOT_TAG[slot]||"无双"))}</div>`;
  layer.classList.remove("show"); void layer.offsetWidth; layer.classList.add("show");
}
function applyEvent(e){
  const log=$(".battle-log"); const rnd=$(".battle-round");
  const bu=s=>$(`[data-bu="${s}"]`);
  if(e.t==="banner"){ const b=$(".skill-banner"); b.textContent=(e.bond?"":e.u.name+" · ")+e.sk; b.classList.remove("enemy"); if(e.u.side==="e")b.classList.add("enemy"); b.style.animation="none"; void b.offsetWidth; b.style.animation=""; const c=bu(e.u.side+""+e.u.idx); if(c){ c.classList.add("cast"); setTimeout(()=>c.classList.remove("cast"),650); } if(e.u&&!e.bond)e.u.energy=0; sfx("skill"); if(e.u.side==="p"){ const cut=ultCutImg(e); if(cut) showUltCut(e.u, e.sk, cut, e.slot); } }
  else if(e.t==="atk"){ const u=bu(e.u.side+""+e.u.idx), t=bu(e.target.side+""+e.target.idx); if(u){u.classList.add("att"); setTimeout(()=>u.classList.remove("att"),200);} if(t){t.classList.add("hit"); setTimeout(()=>t.classList.remove("hit"),380); floatDmg(t,e.text.replace(/.*造成/,"造成"),"");} if(e.d!=null&&e.target) e.target.hp=Math.max(0,e.target.hp-e.d); if(e.target&&e.target.hp>0) e.target.energy=Math.min(100,e.target.energy+20); if(e.u)e.u.energy+=35; if(log){const d=document.createElement("div");d.innerHTML=colorize(e.text);log.appendChild(d);log.scrollTop=log.scrollHeight;} sfx("hit"); }
  else if(e.t==="skillText"){ if(log){const d=document.createElement("div");d.innerHTML=colorize(e.text);log.appendChild(d);log.scrollTop=log.scrollHeight;} }
  else if(e.t==="die"){ const t=bu(e.u.side+""+e.u.idx); if(t)t.classList.add("dead"); e.u.alive=false; e.u.hp=0; }
  else if(e.t==="crit"){ }
  else if(e.t==="stunText"){ if(log){const d=document.createElement("div");d.innerHTML=colorize(e.text);log.appendChild(d);log.scrollTop=log.scrollHeight;} }
  else if(e.t==="stunned"){ const t=bu(e.u.side+""+e.u.idx); if(t){floatDmg(t,"眩晕","dim");} }
  else if(e.t==="skHit"){ if(e.aoe){ fxAoe(e.u.side==="p"?"e":"p"); sfx("skAoe"); } else sfx("skillHit"); (e.targets||[]).forEach(tg=>{ const fu=BATTLE.pUnits.concat(BATTLE.eUnits).find(x=>x.side===tg.side&&x.idx===tg.idx); if(fu&&tg.d!=null){ fu.hp=Math.max(0,fu.hp-tg.d); if(!tg.noGain&&fu.hp>0)fu.energy=Math.min(100,fu.energy+20); } const el=bu(tg.side+""+tg.idx); if(!el)return; el.classList.add("hit"); setTimeout(()=>el.classList.remove("hit"),420); floatDmg(el,"-"+fmt(tg.d),"dmg"); if(tg.crit)floatDmg(el,"暴击","crit"); }); }
  else if(e.t==="skHeal"){ sfx("skHeal"); (e.targets||[]).forEach(tg=>{ const el=bu(tg.side+""+tg.idx); if(!el)return; const fu=BATTLE.pUnits.concat(BATTLE.eUnits).find(x=>x.side===tg.side&&x.idx===tg.idx); if(fu&&tg.h!=null)fu.hp=Math.min(fu.maxHp,fu.hp+tg.h); el.classList.add("healfx"); setTimeout(()=>el.classList.remove("healfx"),720); floatDmg(el,"+"+fmt(tg.h),"heal"); }); }
  else if(e.t==="skBuff"){ sfx("skBuff"); (e.targets||[]).forEach(tg=>{ const el=bu(tg.side+""+tg.idx); if(!el)return; el.classList.add("bufffx"); setTimeout(()=>el.classList.remove("bufffx"),720); floatDmg(el,e.kind==="atk"?"攻击↑":e.kind==="def"?"防御↑":"速度↑","buff"); }); }
  // hp / 能量更新
  BATTLE.pUnits.concat(BATTLE.eUnits).forEach(u=>{ const el=bu(u.side+""+u.idx); if(el){ const pct=Math.max(0,u.hp/u.maxHp*100); const bar=el.querySelector(".bu-hp i"); const tx=el.querySelector(".hp-tx"); if(bar){ bar.style.width=pct+"%"; bar.style.background=pct>50?"linear-gradient(90deg,#42b96a,#8fe09a)":pct>25?"linear-gradient(90deg,#e0a83c,#ffd98a)":"linear-gradient(90deg,#d95b4a,#ff9a8a)"; } if(tx) tx.textContent=Math.round(pct)+"%";
    const en=el.querySelector(".bu-en"); const eni=el.querySelector(".bu-en i"); const ent=el.querySelector(".bu-en .en-tx"); if(en&&eni){ const ep=Math.min(100,Math.max(0,u.energy)); eni.style.width=ep+"%"; en.classList.toggle("ready",u.energy>=70); if(ent) ent.textContent=u.energy>=70?"放技":Math.round(u.energy); } } });
  if(rnd) rnd.textContent="回合 "+BATTLE.rounds;
}
function floatDmg(el,text,cls){
  if(!el)return; const f=document.createElement("div"); f.className="dmg-float "+(cls||""); f.textContent=text;
  el.appendChild(f); setTimeout(()=>f.remove(),1100);
}
function fxAoe(side){
  const v=$("#battle-view"); if(!v)return;
  const f=document.createElement("div"); f.className="fx-aoe "+(side==="p"?"fx-aoe-p":"fx-aoe-e");
  v.appendChild(f); setTimeout(()=>f.remove(),780);
}
function colorize(t){
  return t.replace(/【(.*?)】/g,'<b>【$1】</b>').replace(/造成(\d+)伤害/,'造成<b style="color:#ffd98a">$1</b>伤害').replace(/治疗(\d+)生命/,'治疗<b style="color:#7fe89a">$1</b>生命');
}
function autoPush(){
  if(!S.formation.some(Boolean)){ toast("请先上阵武将","err"); return; }
  let n=0, won=false;
  for(let i=0;i<30;i++){
    const p=makePlayerUnits(), e=genEnemy(S.chapter,S.stage);
    const res=battleResolve(p,e);
    if(res.win){ const idx=stageIdx(); const r=applyStageRewards(S.chapter,S.stage); S.stats.wins++; if(idx>S.clearedMax){S.clearedMax=idx;S.stats.stagesCleared++;} advanceStage(); n++; won=true; }
    else{ S.stats.loses++; won=false; break; }
  }
  saveGame(); renderTopbar(); renderCurrent();
  if(n>0) toast("连战推进 "+n+" 关！","ok"); else toast("连战未推进，战力不足","err");
  sfx(won?"win":"lose");
}
function recoverSweeps(){
  if(!S) return;
  const CD=30*60*1000;
  if(!S.sweepAt) S.sweepAt=Date.now();
  if(S.sweepCount>=S.sweepMax){ S.sweepAt=Date.now(); return; }
  const elapsed=Date.now()-S.sweepAt;
  if(elapsed>=CD){
    const gained=Math.floor(elapsed/CD);
    S.sweepCount=Math.min(S.sweepMax,S.sweepCount+gained);
    S.sweepAt+=gained*CD;
    if(S.sweepCount>=S.sweepMax){ S.sweepAt=Date.now(); }
  }
}
function sweep(n){
  const idx=stageIdx();
  if(S.clearedMax<idx){ toast("先通关当前关卡才能扫荡","err"); return; }
  recoverSweeps();
  if(S.sweepCount<n){ toast("扫荡次数不足（剩余"+S.sweepCount+"次），每30分钟恢复1次","err"); return; }
  S.sweepCount-=n;
  let got=0, extra=[];
  for(let i=0;i<n;i++){
    const r=applyStageRewards(S.chapter,S.stage,true);
    got++; if(r.gained.length) extra.push(r.gained.join("、"));
  }
  saveGame(); renderTopbar(); renderCurrent();
  toast("扫荡完成 ×"+got+"（剩余扫荡"+S.sweepCount+"次）"+(extra.length? " · "+extra.join("、"):""),"ok");
  sfx("win");
}
function openSweepModal(c,s){
  recoverSweeps();
  const st=(s-1)%10+1;
  const CD=30*60*1000;
  const nextIn=S.sweepCount<S.sweepMax? Math.max(0,Math.ceil((S.sweepAt+CD-Date.now())/60000)) : 0;
  const hint=S.sweepCount>=S.sweepMax?"扫荡次数已满（"+S.sweepMax+"次）":("剩余 "+S.sweepCount+"/"+S.sweepMax+" 次 · 下次恢复约"+nextIn+"分钟后");
  modal(`
  <div style="text-align:center;padding:8px 6px 2px">
    <div style="font-size:20px;font-weight:800;color:var(--gold)">第${st}关 · 扫荡</div>
    <div style="font-size:12px;color:var(--dim);margin:8px 0 4px">该关已通关，扫荡可直接获得战斗奖励</div>
    <div style="font-size:12px;color:var(--gold);margin:0 0 12px">${hint}</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-ghost" style="flex:1" data-sweep="1" ${S.sweepCount<1?"disabled":""}>扫荡×1</button>
      <button class="btn btn-gold" style="flex:1" data-sweep="10" ${S.sweepCount<10?"disabled":""}>扫荡×10</button>
    </div>
    <button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="closeModal()">取消</button>
  </div>`);
  $$("#modal-root [data-sweep]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.sweep; closeModal();
    S.chapter=c; S.stage=s; saveGame(); renderCurrent();
    sweep(n);
  });
}

     <div style="margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="openHeroModal('${heroId}')">返回武将</button></div>
   </div>`);
  $$("#modal-root [data-item]").forEach(el=>el.onclick=()=>{ if(el.dataset.item===equippedId) return; if(equipItem(heroId,slot,el.dataset.item)){ saveGame(); toast("装备成功","ok"); sfx("click"); openEquipModal(heroId,slot); } });
  $$("#modal-root [data-eqop]").forEach(el=>el.onclick=()=>{
    if(el.dataset.eqop==="up"){ if(upgradeEq(heroId,slot)){ toast("强化成功","ok"); sfx("skill"); openEquipModal(heroId,slot); } }
    else{ unequip(heroId,slot); saveGame(); toast("已卸下","ok"); openEquipModal(heroId,slot); }
  });
}
/* ============ 装备合成 ============ */
function craftCount(){ const cnt=[0,0,0,0,0,0]; for(const k in S.equipInv){ const it=S.equipInv[k]; if(it&&!it.onHero) cnt[it.r]++; } return cnt; }
function craftEquips(r){
  const ids=Object.keys(S.equipInv).filter(k=>{ const it=S.equipInv[k]; return it&&!it.onHero&&it.r===r; }).slice(0,5);
  if(ids.length<5){ toast("该品质未穿戴装备不足 5 件","err"); return null; }
  ids.forEach(k=>delete S.equipInv[k]);
  const slot=EQ_SLOTS[Math.floor(Math.random()*5)].id;
  const id=uid(); S.equipInv[id]={id,slot,r:r+1,lv:0}; return id;
}
function openCraftModal(){
  const cnt=craftCount();
  modal(`
   <button class="m-close" onclick="closeModal()">×</button>
   <div class="m-head"><div><div class="m-name" style="font-size:17px">装备合成</div>
   <div style="font-size:12px;color:var(--dim);margin-top:4px">任意 5 件同品质【未穿戴】装备，合成 1 件更高品质</div></div></div>
   <div class="m-body">
     <div style="font-size:11.5px;color:var(--faint);margin-bottom:10px">已穿在武将身上的装备不会参与合成；合成结果自动放入背包。</div>
     ${EQ_RAR.map((rr,i)=>{
       const n=cnt[i], times=Math.floor(n/5);
       const can=i<5 && times>0;
       return `<div class="craft-row">
         <span class="craft-dot" style="background:${rr.c}"></span>
         <span class="craft-name" style="color:${rr.c}">${rr.n}</span>
         <span class="craft-n">未穿戴 ${n} 件${i>=5?" · 已达最高品质":""}</span>
         ${can?`<button class="btn btn-gold btn-sm craft-btn" data-craft="${i}">合成 ×${times}</button>`:`<span class="craft-btn" style="font-size:11px;color:var(--faint)">${i>=5?"无法合成":"不足 5 件"}</span>`}
       </div>`; }).join("")}
     <div style="margin-top:4px;font-size:11.5px;color:var(--faint)">品质：凡品 → 良品 → 精良 → 珍品 → 极品 → 传说</div>
     <div style="margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="closeModal()">关闭</button></div>
   </div>`);
  $$("#modal-root [data-craft]").forEach(b=>b.onclick=()=>{
    const r=+b.dataset.craft, times=Math.floor(craftCount()[r]/5);
    if(times<1){ toast("该品质未穿戴装备不足 5 件","err"); return; }
    const got=[];
    for(let i=0;i<times;i++){ const id=craftEquips(r); if(id) got.push(eqName(S.equipInv[id].slot,S.equipInv[id].r)); }
    saveGame(); sfx("skill");
    toast("合成 "+got.length+" 件："+got.slice(0,3).join("、")+(got.length>3?" 等 "+got.length+" 件":"")+(got.length===1?"":""),"ok");
    openCraftModal();
  });
}

/* ============ 新手引导 / 离线收益 ============ */
function openIntro(){
  modal(`
   <button class="m-close" style="display:none">×</button>
   <div class="m-head"><div class="h-med" style="width:72px;height:72px;font-size:34px;background:linear-gradient(160deg,#c9a24b,#5b3d14);border-color:#e8c87a">汉</div>
     <div><div class="m-name">群雄逐鹿</div>
     <div style="font-size:12px;color:var(--dim);margin-top:4px">挂机闯关 · 四阵营 · 羁绊 · 装备</div></div></div>
   <div class="m-body">
     <div class="guide-list">
       <div class="guide-step"><span class="gs-n">1</span><p>开局即送 <b style="color:var(--gold2)">刘备、赵云</b> 等 6 名武将，已自动上阵。</p></div>
       <div class="guide-step"><span class="gs-n">2</span><p>去<b>推图</b>自动战斗推进关卡，每关获得金币、经验与装备。</p></div>
       <div class="guide-step"><span class="gs-n">3</span><p>挂机收益持续累积，离线 12 小时内登录自动领取。</p></div>
       <div class="guide-step"><span class="gs-n">4</span><p>用<b>招募令</b>招募更多武将，凑齐羁绊（如桃园结义）大幅提升战力。</p></div>
       <div class="guide-step"><span class="gs-n">5</span><p>武将升级升星、装备强化，战力达标即可通关首领关。</p></div>
     </div>
     <div style="text-align:center;margin-top:16px"><button class="btn btn-gold" onclick="introDone()">开始征战</button></div>
   </div>`);
  $("#modal-root .m-veil").onclick=null;
}
function introDone(){ S.seenIntro=true; saveGame(); closeModal(); sfx("win"); }
function showOffline(off){
  modal(`
   <button class="m-close" onclick="closeModal()">×</button>
   <div class="m-head"><div><div class="m-name">欢迎归来</div><div style="font-size:12px;color:var(--dim);margin-top:4px">离线 ${fmtT(off.mins*60000)} 的挂机收益已发放</div></div></div>
   <div class="m-body"><div class="br-rewards" style="justify-content:flex-start">
     <span class="br-reward">金币 <b>+${fmt(off.gold)}</b></span>
     <span class="br-reward">经验 <b>+${fmt(off.exp)}</b></span>
     ${off.t?`<span class="br-reward">招募令 <b>+${off.t}</b></span>`:""}
     ${off.eq?`<span class="br-reward">装备 <b>×${off.eq}</b></span>`:""}
   </div>
   <div style="text-align:center;margin-top:14px"><button class="btn btn-gold" onclick="closeModal();renderTopbar();if(!S.seenIntro)openIntro()">收下</button></div></div>`);
  saveGame(); renderTopbar();
}

/* ============ 动作绑定 ============ */
function bindActions(){
  $$("#view [data-ffac]").forEach(b=>b.onclick=()=>{ HERO_FILTER.fac=b.dataset.ffac; renderCurrent(); });
  $$("#view [data-frar]").forEach(b=>b.onclick=()=>{ HERO_FILTER.rar=b.dataset.frar; renderCurrent(); });
  $$("#view [data-fslot]").forEach(el=>el.onclick=()=>openSlotModal(+el.dataset.fslot));
  $$("#view [data-chap]").forEach(b=>b.onclick=()=>{ VIEW_CHAP=+b.dataset.chap; renderCurrent(); });
  $$("#view [data-node]").forEach(el=>el.onclick=()=>{
    const idx=+el.dataset.node;
    if(idx===stageIdx()) startBattle(true);
    else if(idx<=S.clearedMax){ const c=Math.floor((idx-1)/10)+1, s=(idx-1)%10+1; S.chapter=c; S.stage=s; saveGame(); renderCurrent(); openSweepModal(c,s); }
    else toast("请先通关前置关卡","err");
  });
  $$("#view [data-act]").forEach(b=>{
    const a=b.dataset.act;
    b.onclick=()=>{
      if(a==="battle") location.hash="#/battle";
      else if(a==="recruit") location.hash="#/recruit";
      else if(a==="formation") location.hash="#/formation";
      else if(a==="codex") location.hash="#/codex";
      else if(a==="collectIdle") collectIdle();
      else if(a==="startBattle") startBattle(true);
      else if(a==="autoPush") autoPush();
      else if(a==="sweep1") sweep(1);
      else if(a==="sweep10") sweep(10);
      else if(a==="speedToggle"){ BATTLE.speed=BATTLE.speed===1?2:BATTLE.speed===2?4:1; $$("[data-act='speedToggle']").forEach(x=>x.textContent="速度 ×"+BATTLE.speed); sfx("click"); }
      else if(a==="abortBattle"){ clearTimeout(BATTLE.timer); BATTLE.phase="done"; finishBattle(BATTLE.win,true); }
      else if(a==="backMap"){ clearTimeout(BATTLE.timer); BATTLE.phase="idle"; renderBattleBox(); }
      else if(a==="pull1") doPull(1,false);
      else if(a==="pull10") doPull(10,false);
      else if(a==="freePull") doPull(1,true);
      else if(a==="exportSave") exportSave();
      else if(a==="importSave") importSave();
      else if(a==="resetSave") resetSave();
      else if(a==="runCmd") runTestCmd();
      else toast("功能开发中","err");
    };
  });
  $$("#view [data-sound]").forEach(el=>el.onclick=()=>{ S.sound=!S.sound; saveGame(); renderCurrent(); if(S.sound)sfx("click"); });
  $$("#view [data-music]").forEach(el=>el.onclick=()=>{ S.music=!S.music; saveGame(); renderCurrent(); applyMusic(); });
}
{ const old=bindView; window.bindView=function(){ old(); bindActions(); }; }

/* ============ 启动 ============ */
function boot(){
  if(!loadGame()){ S=defaultState(); }
  cur=location.hash||"#/home";
  window.addEventListener("hashchange",()=>{ cur=location.hash||"#/home"; renderAll(); sfx("click"); });
  renderAll();
  recoverSweeps(); saveGame();
  setInterval(()=>{ idleTick(); const p=S.pending; if(Math.floor(p.gold)||Math.floor(p.exp)||Math.floor(p.tickets)||Math.floor(p.eqs)){ renderTopbar(); if(cur==="#/home") renderCurrent(); } },5000);
  setInterval(saveGame,30000);
  window.addEventListener("beforeunload",saveGame);
  document.addEventListener("pointerdown",initAudio,{once:true});
  document.addEventListener("pointerdown",tryPlayBGM,{once:true});
  $("#topbar").addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const act=b.dataset.act;
    if(act==="music"){ S.music=!S.music; saveGame(); applyMusic(); renderTopbar(); }
    else if(act==="settings"){ sfx("click"); location.hash="#/settings"; }
  });
  const off=calcOffline();
  if(off){ setTimeout(()=>showOffline(off),600); }
  else if(!S.seenIntro){ setTimeout(()=>{ if(!$("#modal-root.open")) openIntro(); },1200); }
}
boot();
</script>
